name: Feature request
description: Explain a workflow VYBE could improve.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and alternatives
      description: Include the target OS or desktop if relevant.
    validations:
      required: true
