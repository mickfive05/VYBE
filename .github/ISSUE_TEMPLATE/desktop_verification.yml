name: Desktop verification
description: Share real installation, clipboard, and shortcut results.
title: "[Desktop]: "
body:
  - type: input
    id: environment
    attributes:
      label: OS, version, desktop, Python, and VYBE version
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results for each check
      description: "Mark PASS / FAIL / UNTESTED for doctor, clipboard, MP4, MP3, physical shortcuts, cancellation, and background startup. Include FFprobe results if available."
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup details and corrections
      description: Describe permissions, installation changes, or native desktop shortcut steps. Remove private data and URLs.
